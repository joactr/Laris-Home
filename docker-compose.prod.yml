services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: larishome
      POSTGRES_USER: larishome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larishome -d larishome"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_BACKUP_DATABASE:-larishome}
      PGUSER: ${DB_BACKUP_USER:-larishome}
      BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
    volumes:
      - ./ops/db-backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups/postgres:/backups
    command: ["sh", "/usr/local/bin/backup.sh"]

  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://larishome:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/larishome
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    command: npm start

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
